{{- if .Values.frontend.enabled }}
{{- $component := "frontend" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ravnar.component-name" (dict "top" . "component" $component) }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ravnar.labels" (dict "top" . "component" $component) | nindent 4 }}
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  selector:
    matchLabels:
      {{- include "ravnar.selectorLabels" (dict "top" . "component" $component) | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- with .Values.frontend.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "ravnar.labels" (dict "top" . "component" $component) | nindent 8 }}
        {{- with .Values.frontend.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.frontend.securityContext.pod }}
      securityContext:
        {{- . | toYaml | nindent 8 }}
      {{- end }}
      containers:
        - name: frontend
          image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          {{- with .Values.frontend.securityContext.container }}
          securityContext:
            {{- . | toYaml | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
          env:
            - name: KEYCLOAK_URL
              value: {{ .Values.keycloak.url | required "keycloak.url is required" | quote }}
            - name: KEYCLOAK_REALM
              value: {{ .Values.keycloak.realm | quote }}
            - name: KEYCLOAK_CLIENT_ID
              value: {{ .Values.keycloak.clientId | default (printf "%s-%s-spa" .Release.Namespace (include "ravnar.component-name" (dict "top" . "component" $component))) | quote }}
            - name: BRANDING_TITLE
              value: {{ .Values.frontend.branding.title | default "" | quote }}
            - name: BRANDING_LOGO_URL
              value: {{ .Values.frontend.branding.logoUrl | default "" | quote }}
            - name: BRANDING_LOGO_URL_DARK
              value: {{ .Values.frontend.branding.logoUrlDark | default "" | quote }}
            - name: BRANDING_FAVICON_URL
              value: {{ .Values.frontend.branding.faviconUrl | default "" | quote }}
            - name: BRANDING_THEME_LIGHT
              value: {{ .Values.frontend.branding.theme.light | default dict | toJson | quote }}
            - name: BRANDING_THEME_DARK
              value: {{ .Values.frontend.branding.theme.dark | default dict | toJson | quote }}
            {{- with include "nebari-chat.ravnarContextJson" . | fromJson }}
            - name: API_URL
              value: {{ $.Values.frontend.api.url | default (printf "http://%s.%s.svc.cluster.local:%d" (include "ravnar.fullname" .) $.Release.Namespace (.Values.service.port | default 80 | int)) | quote }}
            {{- end }}
          ports:
            - containerPort: {{ .Values.frontend.service.targetPort }}
          startupProbe:
            httpGet:
              port: {{ .Values.frontend.service.targetPort }}
              path: /healthz
            periodSeconds: 1
            timeoutSeconds: 1
            failureThreshold: 30
          livenessProbe:
            httpGet:
              port: {{ .Values.frontend.service.targetPort }}
              path: /healthz
            periodSeconds: 10
            timeoutSeconds: 1
            failureThreshold: 3
{{- end }}
