ravnar:
  image:
    tag: "main"
  postgres:
    password:
      valueFrom:
        secretKeyRef:
          name: postgres-password
          key: password
  extraEnv:
    OPENROUTER_API_KEY:
      valueFrom:
        secretKeyRef:
          name: api-keys
          key: openrouter
    AUSTIN_PERMITS_DB_PASSWORD:
      valueFrom:
        secretKeyRef:
          name: austin-permits-password
          key: password

keycloak:
  url: "https://keycloak.nebari.openteams.ai"

backend:
  nebariApp:
    hostname: "ravnar.nebari.openteams.ai"

frontend:
  image:
    tag: "main"
  nebariApp:
    hostname: "chat.nebari.openteams.ai"

config:
  inline:
    agents:
      claude:
        cls_or_fn: ravnar.agents.PydanticAiAgentWrapper
        params:
          agent: &pydantic-claude
            cls_or_fn: pydantic_ai.Agent
            params:
              model:
                cls_or_fn: pydantic_ai.models.openrouter.OpenRouterModel
                params:
                  model_name: anthropic/claude-sonnet-4.6
                  provider:
                    cls_or_fn: pydantic_ai.providers.openrouter.OpenRouterProvider
                    params:
                      api_key: '{{ include "ravnar.env.templateLiteral" "OPENROUTER_API_KEY" }}'
          capabilities:
            identity:
              name: "Chat Agent (Claude Sonnet 4.6)"
              provider: "OpenAI"
              description: "Claude Sonnet 4.6 is a powerful language model developed by Anthropic."
      gpt:
        cls_or_fn: ravnar.agents.PydanticAiAgentWrapper
        params:
          agent:
            cls_or_fn: pydantic_ai.Agent
            params:
              model:
                cls_or_fn: pydantic_ai.models.openrouter.OpenRouterModel
                params:
                  model_name: openai/gpt-5.5
                  provider:
                    cls_or_fn: pydantic_ai.providers.openrouter.OpenRouterProvider
                    params:
                      api_key: '{{ include "ravnar.env.templateLiteral" "OPENROUTER_API_KEY" }}'
          capabilities:
            identity:
              name: "Chat Agent (OpenAI GPT 5.5)"
              provider: "OpenAI"
              description: "GPT-5.5 is the latest iteration of OpenAI's Generative Pre-trained Transformer series."
      nemo:
        cls_or_fn: ravnar.agents.PydanticAiAgentWrapper
        params:
          agent:
            cls_or_fn: pydantic_ai.Agent
            params:
              model:
                cls_or_fn: pydantic_ai.models.openrouter.OpenRouterModel
                params:
                  model_name: nvidia/nemotron-3-super-120b-a12b
                  provider:
                    cls_or_fn: pydantic_ai.providers.openrouter.OpenRouterProvider
                    params:
                      api_key: '{{ include "ravnar.env.templateLiteral" "OPENROUTER_API_KEY" }}'
          capabilities:
            identity:
              name: "Chat Agent (NVidia Nemotrom 3 Super)"
              provider: "OpenAI"
              description: "NVIDIA NeMo is a powerful language model developed by NVIDIA."
      permits-claude:
        cls_or_fn: ravnar_nebari_chat.make_austin_permits_agent
        params:
          agent: *pydantic-claude
          database_url: '{{
            printf "postgresql+psycopg://%s:%s@%s:%s/%s"
            "postgres"
            (include "ravnar.env.templateLiteral" "AUSTIN_PERMITS_DB_PASSWORD")
            "35.239.102.65"
            "5432"
            "austin_permits"
          -}}'
