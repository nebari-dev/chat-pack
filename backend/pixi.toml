[workspace]
authors = ["Philip Meier <github.pmeier@posteo.de>"]
channels = ["conda-forge"]
name = "backend"
platforms = ["linux-64"]
version = "0.1.0"

[dependencies]
python = ">=3.11,<3.15"

[pypi-dependencies]
ravnar-nebari-chat = {path = "."}
cryptography =">=45.0.7"
httpx = ">=0.28.1"
openai =">=2.35.1,<3"
pyjwt = ">=2.12.1,<3"
sqlalchemy = {version = ">=2.0,<3", extras=["asyncio"]}
psycopg = {version = ">=3.2.9,<4", extras=["binary", "pool"]}
ravnar = {version = "==0.0.16", extras=["serve", "pydantic-ai"]}
opentelemetry-exporter-otlp = ">=1.39.0"
pydantic-ai-slim = {version = "*", extras=["mcp", "google"]}

[tool.nebi.bundle]
include = ["src/**/*", "pyproject.toml", "README.md"]
