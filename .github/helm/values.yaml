keycloak:
  url: keycloak.example.com
config:
  inline:
    agents:
      dynamic:
        enabled: true
backend:
  nebariapp:
    hostname: backend.example.com
  catalog:
    tools:
      charts:
        kind: visualization
        label: Charts and maps
      permits:
        kind: sql
        label: Austin permits
        description: Building permits, read-only
        database_url: "postgresql+psycopg://reader:{{ PERMITS_DB_PASSWORD }}@db.example/permits"
    mcp_servers:
      frames:
        label: Frames
        url: https://frames.example/mcp
        auth: impersonate
        tool_prefix: frames
frontend:
  enabled: true
  nebariapp:
    hostname: frontend.example.com
  agentAuthoring:
    models:
      - id: anthropic/claude-sonnet-4.6
        label: Claude Sonnet 4.6
ravnar:
  extraEnv:
    NEBARI_CHAT_AGENT_MODELS:
      value: anthropic/claude-sonnet-4.6
