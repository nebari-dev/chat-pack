name: PyPI build

on:
  pull_request:
  push:
    tags: 
      - 'v[0-9]+\.[0-9]+\.[0-9]+'

jobs:
  pypi:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Install uv and set the python version
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          working-directory: ./backend
          enable-cache: true

      - name: Build binary and source distribution
        working-directory: ./backend
        run: uv build

      - name: Publish to PyPI
        # OIDC tokens are unavailable to pull requests from forks, so the
        # dry-run publish can only run for same-repo branches and tag pushes.
        if: github.ref_type == 'tag' || github.event.pull_request.head.repo.fork == false
        working-directory: ./backend
        run: |
          uv publish --no-progress \
          ${{ github.ref_type != 'tag' && '--dry-run' || '' }} \
          --trusted-publishing=always \
          dist/*
